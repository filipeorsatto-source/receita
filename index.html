  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Mono:wght@300;400&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #FAFAF9;
    --surface: #FFFFFF;
    --surface2: #F5F4F2;
    --border: #E8E6E1;
    --border2: #D4D1CA;
    --text: #1A1916;
    --text2: #6B6860;
    --text3: #A8A49D;
    --accent: #1A6B4A;
    --accent-light: #E8F4EE;
    --accent-mid: #2E8B63;
    --blue: #2563EB;
    --blue-light: #EFF6FF;
    --amber: #D97706;
    --amber-light: #FFFBEB;
    --red: #DC2626;
    --red-light: #FEF2F2;
    --purple: #7C3AED;
    --purple-light: #F5F3FF;
    --font: 'DM Sans', system-ui, sans-serif;
    --mono: 'DM Mono', monospace;
    --radius: 8px;
    --radius-lg: 12px;
    --sidebar-w: 220px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
  }

  body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }

  /* Layout */
  .app { display: flex; min-height: 100vh; }
  .sidebar {
    width: var(--sidebar-w); flex-shrink: 0; background: var(--surface);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
    position: fixed; top: 0; left: 0; height: 100vh; z-index: 100;
    overflow-y: auto;
  }
  .sidebar-logo {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-logo h1 {
    font-size: 15px; font-weight: 600; color: var(--text); letter-spacing: -0.01em;
    display: flex; align-items: center; gap: 8px;
  }
  .logo-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; }
  .sidebar-logo p { font-size: 11px; color: var(--text3); margin-top: 2px; font-weight: 400; }
  .sidebar-nav { padding: 8px 8px; flex: 1; }
  .nav-label { font-size: 10px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; padding: 8px 12px 4px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    border-radius: var(--radius); cursor: pointer; font-size: 13px; font-weight: 500;
    color: var(--text2); transition: all 0.12s; margin-bottom: 1px; border: none;
    background: none; width: 100%; text-align: left;
  }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background: var(--accent-light); color: var(--accent); }
  .nav-item svg { flex-shrink: 0; opacity: 0.7; }
  .nav-item.active svg { opacity: 1; }
  .main { margin-left: var(--sidebar-w); flex: 1; min-height: 100vh; }

  /* Header */
  .page-header {
    padding: 28px 32px 0; display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; background: var(--bg); z-index: 10;
    border-bottom: 1px solid var(--border); padding-bottom: 20px;
    backdrop-filter: blur(8px); background: rgba(250,250,249,0.9);
  }
  .page-header h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; color: var(--text); }
  .page-header p { font-size: 13px; color: var(--text3); margin-top: 2px; }
  .page-content { padding: 24px 32px; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px;
    border-radius: var(--radius); font-size: 13px; font-weight: 500; cursor: pointer;
    transition: all 0.12s; border: 1px solid transparent; font-family: var(--font);
  }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { background: var(--accent-mid); border-color: var(--accent-mid); }
  .btn-secondary { background: var(--surface); color: var(--text); border-color: var(--border2); }
  .btn-secondary:hover { background: var(--surface2); border-color: var(--border2); }
  .btn-ghost { background: none; color: var(--text2); border-color: transparent; }
  .btn-ghost:hover { background: var(--surface2); color: var(--text); }
  .btn-danger { background: var(--red-light); color: var(--red); border-color: transparent; }
  .btn-danger:hover { background: #FEE2E2; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .btn-icon { padding: 6px; border-radius: var(--radius); background: none; border: none; cursor: pointer; color: var(--text3); transition: all 0.12s; }
  .btn-icon:hover { background: var(--surface2); color: var(--text); }

  /* Cards */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 20px;
    box-shadow: var(--shadow);
  }
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .kpi-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 16px 20px;
    box-shadow: var(--shadow);
  }
  .kpi-label { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
  .kpi-value { font-size: 24px; font-weight: 600; letter-spacing: -0.03em; color: var(--text); font-family: var(--mono); }
  .kpi-sub { font-size: 11px; color: var(--text3); margin-top: 4px; }
  .kpi-card.accent { background: var(--accent); border-color: var(--accent); }
  .kpi-card.accent .kpi-label, .kpi-card.accent .kpi-value, .kpi-card.accent .kpi-sub { color: rgba(255,255,255,0.9); }

  /* Table */
  .table-wrap { overflow-x: auto; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--surface); }
  thead { background: var(--surface2); }
  th { padding: 10px 14px; text-align: left; font-weight: 600; color: var(--text2); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 11px 14px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--surface2); }
  .num { font-family: var(--mono); font-size: 12px; text-align: right; }
  .th-num { text-align: right; }

  /* Badges */
  .badge {
    display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px;
    border-radius: 100px; font-size: 11px; font-weight: 600;
  }
  .badge-green { background: var(--accent-light); color: var(--accent); }
  .badge-amber { background: var(--amber-light); color: var(--amber); }
  .badge-blue { background: var(--blue-light); color: var(--blue); }
  .badge-purple { background: var(--purple-light); color: var(--purple); }
  .badge-gray { background: var(--surface2); color: var(--text2); }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1000;
    display: flex; align-items: center; justify-content: center; padding: 20px;
    backdrop-filter: blur(2px);
    animation: fadeIn 0.15s ease;
  }
  .modal {
    background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-md);
    width: 100%; max-width: 680px; max-height: 92vh; overflow-y: auto;
    animation: slideUp 0.2s ease;
    border: 1px solid var(--border);
  }
  .modal-lg { max-width: 900px; }
  .modal-header {
    padding: 20px 24px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0;
    background: var(--surface); z-index: 1;
  }
  .modal-header h3 { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
  .modal-body { padding: 24px; }
  .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }

  /* Form */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .form-full { grid-column: 1 / -1; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--text2); }
  .field input, .field select, .field textarea {
    padding: 8px 12px; border: 1px solid var(--border2); border-radius: var(--radius);
    font-size: 13px; font-family: var(--font); color: var(--text); background: var(--surface);
    transition: border-color 0.12s, box-shadow 0.12s; outline: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px rgba(26,107,74,0.1);
  }
  .field textarea { resize: vertical; min-height: 80px; }
  .field-hint { font-size: 11px; color: var(--text3); }

  /* Premissas table */
  .prem-grid { display: grid; gap: 8px; }
  .prem-period-grid {
    display: grid;
    grid-template-columns: repeat(16, minmax(70px, 1fr));
    gap: 6px;
  }
  .prem-period-label { font-size: 10px; font-weight: 600; color: var(--text3); text-align: center; }
  .prem-period-input {
    width: 100%; padding: 5px 6px; border: 1px solid var(--border2); border-radius: 5px;
    font-size: 11px; font-family: var(--mono); text-align: right; outline: none;
  }
  .prem-period-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(26,107,74,0.1); }

  /* Chart section */
  .chart-section { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 24px; }
  .section-title { font-size: 13px; font-weight: 600; color: var(--text2); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .section-title span { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 2px 8px; font-size: 11px; color: var(--text3); font-weight: 500; }

  /* Client cards */
  .client-group { margin-bottom: 28px; }
  .client-group-header { font-size: 12px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; padding: 0 4px; display: flex; align-items: center; gap: 8px; }
  .client-group-header::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .client-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
  .client-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);

    position: relative;
  }
  .client-card:hover { border-color: var(--accent); box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .client-card h3 { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 4px; letter-spacing: -0.01em; }
  .client-card .meta { font-size: 11px; color: var(--text3); display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .client-card .metric { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .client-card .metric-item { font-size: 11px; }
  .client-card .metric-item .lbl { color: var(--text3); }
  .client-card .metric-item .val { font-family: var(--mono); font-weight: 600; color: var(--text); font-size: 13px; }
  .client-actions { position: absolute; top: 12px; right: 12px; display: flex; gap: 4px; opacity: 0; transition: opacity 0.12s; }
  .client-card:hover .client-actions { opacity: 1; }

  /* Var selector */
  .var-tabs { display: flex; gap: 4px; background: var(--surface2); border-radius: var(--radius); padding: 4px; border: 1px solid var(--border); }
  .var-tab { padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer; color: var(--text2); border: none; background: none; transition: all 0.12s; font-family: var(--font); }
  .var-tab.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.08); font-weight: 600; }

  /* Filter bar */
  .filter-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
  .filter-bar select { padding: 7px 10px; border: 1px solid var(--border2); border-radius: var(--radius); font-size: 12px; font-family: var(--font); color: var(--text); background: var(--surface); outline: none; cursor: pointer; }
  .filter-bar select:focus { border-color: var(--accent); }
  .filter-sep { width: 1px; height: 20px; background: var(--border); }

  /* Expandable row */
  .expand-btn { background: none; border: none; cursor: pointer; color: var(--text3); display: flex; align-items: center; gap: 4px; font-size: 12px; padding: 2px 4px; border-radius: 4px; }
  .expand-btn:hover { color: var(--text); background: var(--surface2); }
  .expanded-row { background: var(--surface2); }
  .expanded-content { padding: 16px 20px; border-top: 1px solid var(--border); }

  /* Upsell textarea */
  .upsell-area {
    width: 100%; min-height: 140px; padding: 12px 16px; border: 1px solid var(--border2);
    border-radius: var(--radius-lg); font-size: 13px; font-family: var(--font); color: var(--text);
    background: var(--surface); resize: vertical; outline: none; line-height: 1.6;
    transition: border-color 0.12s;
  }
  .upsell-area:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(26,107,74,0.1); }

  /* Back button */
  .back-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text2); cursor: pointer; padding: 6px 10px; border-radius: var(--radius); border: none; background: none; font-family: var(--font); font-weight: 500; transition: all 0.12s; }
  .back-btn:hover { background: var(--surface2); color: var(--text); }

  /* Empty state */
  .empty { text-align: center; padding: 60px 20px; }
  .empty-icon { font-size: 32px; margin-bottom: 12px; opacity: 0.4; }
  .empty h3 { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .empty p { font-size: 13px; color: var(--text3); max-width: 320px; margin: 0 auto; }

  /* Divider */
  .divider { height: 1px; background: var(--border); margin: 24px 0; }
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .section-header h3 { font-size: 14px; font-weight: 600; color: var(--text); letter-spacing: -0.01em; }

  /* Dashboard chart cards */
  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow); }

  /* Tooltip */
  .recharts-tooltip-wrapper .custom-tooltip {
    background: var(--surface) !important; border: 1px solid var(--border) !important;
    border-radius: var(--radius) !important; padding: 10px 14px !important;
    box-shadow: var(--shadow-md) !important; font-family: var(--font) !important;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

  /* Animations */
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  /* Toast */
  .toast {

    padding: 10px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 500;
    z-index: 9999; animation: slideUp 0.2s ease; box-shadow: var(--shadow-md);
  }
